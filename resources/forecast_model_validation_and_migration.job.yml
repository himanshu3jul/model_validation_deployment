resources:
  jobs:
    forecast_model_validation_and_migration:
      name: Forecast Model Validation and Migration
      tasks:
        - task_key: Validation_and_Migration
          email_notifications: {}
          notebook_task:
            notebook_path: Model Validation
            source: GIT
          run_if: ALL_SUCCESS
          webhook_notifications: {}
      parameters:
        - name: model_name
          default: interest_forecast_7_day
        - name: source_catalog
          default: mlops_dev
        - name: source_db
          default: interest_forecast
        - name: validation_data
          default: validation_table
      email_notifications: {}
      git_source:
        git_branch: main
        git_provider: gitHub
        git_url: https://github.com/himanshu3jul/model_validation_deployment
      max_concurrent_runs: 1
      queue:
        enabled: true
      webhook_notifications: {}
